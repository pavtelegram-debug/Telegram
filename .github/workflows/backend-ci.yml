name: Telefost API checks

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "bot/**"
      - "requirements.txt"
      - "render.yaml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "bot/**"
      - "requirements.txt"
      - "render.yaml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile API and bot
        run: python -m py_compile backend/main.py bot/main.py
      - name: Run API tests
        run: python -m unittest backend.test_api
