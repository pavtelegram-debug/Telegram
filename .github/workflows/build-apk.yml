name: Build TelefostGram APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - "TMessagesProj/**"
      - "TMessagesProj_AppStandalone/**"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle"
      - "settings.gradle"
      - "gradlew"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK and NDK
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :TMessagesProj_AppStandalone:assembleAfatStandalone

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelefostGram-APK
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 90
