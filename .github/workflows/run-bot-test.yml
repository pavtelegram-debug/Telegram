name: Run Telefost Void Bot (temporary test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
      TELEFOST_API_URL: ${{ secrets.TELEFOST_API_URL }}
      TELEFOST_BOT_API_KEY: ${{ secrets.TELEFOST_BOT_API_KEY }}
      PYTHONUNBUFFERED: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bot dependencies
        run: python -m pip install -r requirements.txt

      - name: Check required configuration
        shell: bash
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::GitHub Secret BOT_TOKEN is missing."
            exit 1
          fi
          if [ -z "$ADMIN_IDS" ]; then
            echo "::warning::ADMIN_IDS is empty; admin menu may not be available."
          fi
          echo "Required bot token is configured. Token value will not be printed."

      - name: Start bot for a 10-minute test
        shell: bash
        run: |
          python -m py_compile telefost.py
          test -f numbers.json || echo "{}" > numbers.json
          python -u telefost.py &
          BOT_PID=$!
          cleanup() {
            kill -INT "$BOT_PID" 2>/dev/null || true
            wait "$BOT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          echo "Telefost Void bot process started. It will run for up to 10 minutes for testing."
          sleep 600
          echo "10-minute test window finished; stopping the temporary bot process."
