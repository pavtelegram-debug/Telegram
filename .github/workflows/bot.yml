name: Validate Telefost Bot

on:
  push:
    branches: [master]
    paths:
      - "bot/**"
      - "requirements.txt"
      - ".github/workflows/bot.yml"
  pull_request:
    paths:
      - "bot/**"
      - "requirements.txt"
      - ".github/workflows/bot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot dependencies
        run: pip install -r requirements.txt
      - name: Compile bot
        run: python -m py_compile bot/main.py
      - name: Confirm handlers exist
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("bot/main.py").read_text(encoding="utf-8")
          required = [
              'CommandHandler("start"',
              'CallbackQueryHandler(button)',
              'app.run_polling()',
              'BOT_TOKEN',
              'ADMIN_IDS',
              '"+79"',
          ]
          missing = [part for part in required if part not in source]
          if missing:
              raise SystemExit("Missing bot parts: " + ", ".join(missing))
          print("Bot source validation passed")
          PY
